<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="c9-bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#141B24"/>
      <stop offset="65%" stop-color="#0B0E13"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>

    <linearGradient id="c9-film-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F26644"/>
      <stop offset="52%" stop-color="#E8B34E"/>
      <stop offset="100%" stop-color="#84B09B"/>
    </linearGradient>

    <clipPath id="c9-squircle">
      <rect width="512" height="512" rx="114"/>
    </clipPath>

    <clipPath id="c9-analog-half">
      <polygon points="296,0 512,0 512,512 164,512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c9-squircle)">
    <rect width="512" height="512" fill="url(#c9-bg)"/>

    <!-- Sub-pixel Multi-Frame Registration Offset Frames -->
    <rect x="92" y="80" width="308" height="308" rx="28" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="112" y="100" width="308" height="308" rx="28" fill="none" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Primary Sensor / Emulsion Frame -->
    <rect x="102" y="90" width="308" height="308" rx="28" fill="#10151C" stroke="#E2E8F0" stroke-opacity="0.3" stroke-width="3"/>

    <!-- LEFT SIDE: Discrete RGGB Bayer CFA Silicon Microlens Matrix -->
    <g transform="translate(124, 112)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#EF4444" fill-opacity="0.9"/>
      <rect x="68" y="0" width="56" height="56" rx="14" fill="#22C55E" fill-opacity="0.9"/>
      <rect x="136" y="0" width="56" height="56" rx="14" fill="#EF4444" fill-opacity="0.75"/>

      <rect x="0" y="68" width="56" height="56" rx="14" fill="#22C55E" fill-opacity="0.9"/>
      <rect x="68" y="68" width="56" height="56" rx="14" fill="#3B82F6" fill-opacity="0.94"/>
      <rect x="136" y="68" width="56" height="56" rx="14" fill="#22C55E" fill-opacity="0.72"/>

      <rect x="0" y="136" width="56" height="56" rx="14" fill="#EF4444" fill-opacity="0.9"/>
      <rect x="68" y="136" width="56" height="56" rx="14" fill="#22C55E" fill-opacity="0.82"/>

      <rect x="0" y="204" width="56" height="56" rx="14" fill="#22C55E" fill-opacity="0.86"/>
      <rect x="68" y="204" width="56" height="56" rx="14" fill="#3B82F6" fill-opacity="0.75"/>

      <g fill="#FFFFFF" fill-opacity="0.45">
        <circle cx="18" cy="18" r="5.5"/><circle cx="86" cy="18" r="5.5"/><circle cx="154" cy="18" r="5.5"/>
        <circle cx="18" cy="86" r="5.5"/><circle cx="86" cy="86" r="5.5"/>
        <circle cx="18" cy="154" r="5.5"/><circle cx="86" cy="154" r="5.5"/>
        <circle cx="18" cy="222" r="5.5"/>
      </g>
    </g>

    <!-- RIGHT SIDE: Continuous-Tone Organic Silver-Gelatin Emulsion -->
    <g clip-path="url(#c9-analog-half)">
      <rect x="102" y="90" width="308" height="308" rx="28" fill="url(#c9-film-wash)"/>
      <circle cx="326" cy="186" r="52" fill="#FFF6E5" fill-opacity="0.9"/>
      <path d="M160,398 C216,308 278,292 410,332 L410,398 Z" fill="#1D2625" fill-opacity="0.88"/>
      <g fill="#FFF9EE" fill-opacity="0.45">
        <circle cx="288" cy="274" r="3.5"/><circle cx="342" cy="258" r="2.5"/><circle cx="368" cy="296" r="4"/>
        <circle cx="310" cy="322" r="3"/><circle cx="382" cy="218" r="2.5"/><circle cx="264" cy="348" r="3.5"/>
      </g>
    </g>

    <!-- Optical Fusion Boundary Line + Anisotropic Elliptical Kernels -->
    <line x1="292" y1="66" x2="170" y2="418" stroke="#FFF8EB" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="240" cy="212" rx="23" ry="9.5" transform="rotate(-71 240 212)" fill="none" stroke="#FFF8EB" stroke-width="3"/>
    <ellipse cx="212" cy="294" rx="19" ry="8.5" transform="rotate(-71 212 294)" fill="none" stroke="#FFF8EB" stroke-width="3"/>

    <!-- Centered bottom RAW×5 Linear DNG badge (safe inside round & squircle masks) -->
    <rect x="176" y="422" width="160" height="36" rx="18" fill="#17202B" stroke="#F59E0B" stroke-width="2"/>
    <text x="256" y="445" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="700" letter-spacing="1.5">RAW×5 → Ag</text>
  </g>
