plugins {
    id 'com.android.application'
}

android {
    namespace 'app.spektralab.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'app.spektralab.prototype'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            // The prototype is debug-signed so the downloaded APK is installable.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
