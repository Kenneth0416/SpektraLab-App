<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c6-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15181C"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </linearGradient>

    <linearGradient id="c6-yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFCA28" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#FFD54F" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.34"/>
    </linearGradient>

    <linearGradient id="c6-magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC407A" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#FF4081" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#D81B60" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="c6-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26C6DA" stop-opacity="0.28"/>
      <stop offset="38%" stop-color="#00E5FF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0097A7" stop-opacity="0.25"/>
    </linearGradient>

    <clipPath id="c6-squircle">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c6-squircle)">
    <rect width="512" height="512" fill="url(#c6-bg)"/>

    <!-- Precision sensitometric grid -->
    <g stroke="#F3EFE5" stroke-opacity="0.06" stroke-width="1.5">
      <line x1="96" y1="76" x2="96" y2="436"/>
      <line x1="176" y1="76" x2="176" y2="436"/>
      <line x1="256" y1="76" x2="256" y2="436"/>
      <line x1="336" y1="76" x2="336" y2="436"/>
      <line x1="416" y1="76" x2="416" y2="436"/>
      <line x1="76" y1="136" x2="436" y2="136"/>
      <line x1="76" y1="256" x2="436" y2="256"/>
      <line x1="76" y1="376" x2="436" y2="376"/>
    </g>

    <!-- Characteristic HD D-logE S-Curves for R, G, B emulsion layers -->
    <g fill="none" stroke-width="6" stroke-linecap="round" opacity="0.92">
      <path d="M92,388 C168,386 204,344 254,248 C304,152 346,114 420,110" stroke="#00E5FF"/>
      <path d="M92,400 C174,398 212,350 262,252 C312,154 352,124 420,120" stroke="#FF4081"/>
      <path d="M92,376 C160,374 196,336 246,244 C296,152 338,102 420,98" stroke="#FFD54F"/>
    </g>

