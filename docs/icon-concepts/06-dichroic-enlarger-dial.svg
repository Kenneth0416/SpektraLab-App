      <rect x="6" y="6" width="328" height="40" rx="8" fill="url(#c6-yellow)"/>
      <g stroke="#141619" stroke-width="2.5" opacity="0.68">
        <line x1="48" y1="30" x2="48" y2="46"/><line x1="92" y1="22" x2="92" y2="46"/>
        <line x1="136" y1="30" x2="136" y2="46"/><line x1="170" y1="16" x2="170" y2="46"/>
        <line x1="204" y1="30" x2="204" y2="46"/><line x1="248" y1="22" x2="248" y2="46"/>
        <line x1="292" y1="30" x2="292" y2="46"/>
      </g>
      <rect x="156" y="-6" width="28" height="64" rx="6" fill="#F6F3EB" stroke="#141619" stroke-width="3"/>
