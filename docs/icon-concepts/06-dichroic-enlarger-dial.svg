    <circle cx="185" cy="419" r="5.5" fill="#EF563D"/>
    <text x="266" y="425" text-anchor="middle" fill="#F3EFE5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="600" letter-spacing="1.5">+0.7 EV · YMC</text>
  </g>
