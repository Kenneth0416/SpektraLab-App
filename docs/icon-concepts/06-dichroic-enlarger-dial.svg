    </g>

    <g transform="translate(86, 232)">
      <rect width="340" height="52" rx="12" fill="#1E2126" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
      <rect x="6" y="6" width="328" height="40" rx="8" fill="url(#c6-magenta)"/>
      <g stroke="#141619" stroke-width="2.5" opacity="0.68">
        <line x1="48" y1="30" x2="48" y2="46"/><line x1="92" y1="22" x2="92" y2="46"/>
        <line x1="136" y1="30" x2="136" y2="46"/><line x1="170" y1="16" x2="170" y2="46"/>
        <line x1="204" y1="30" x2="204" y2="46"/><line x1="248" y1="22" x2="248" y2="46"/>
        <line x1="292" y1="30" x2="292" y2="46"/>
      </g>
      <rect x="214" y="-6" width="28" height="64" rx="6" fill="#F6F3EB" stroke="#141619" stroke-width="3"/>
      <line x1="228" y1="4" x2="228" y2="48" stroke="#EF563D" stroke-width="3.5"/>
    </g>

    <g transform="translate(86, 312)">
      <rect width="340" height="52" rx="12" fill="#1E2126" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
      <rect x="6" y="6" width="328" height="40" rx="8" fill="url(#c6-cyan)"/>
      <g stroke="#141619" stroke-width="2.5" opacity="0.68">
        <line x1="48" y1="30" x2="48" y2="46"/><line x1="92" y1="22" x2="92" y2="46"/>
        <line x1="136" y1="30" x2="136" y2="46"/><line x1="170" y1="16" x2="170" y2="46"/>
        <line x1="204" y1="30" x2="204" y2="46"/><line x1="248" y1="22" x2="248" y2="46"/>
        <line x1="292" y1="30" x2="292" y2="46"/>
      </g>
      <rect x="112" y="-6" width="28" height="64" rx="6" fill="#F6F3EB" stroke="#141619" stroke-width="3"/>
      <line x1="126" y1="4" x2="126" y2="48" stroke="#EF563D" stroke-width="3.5"/>
